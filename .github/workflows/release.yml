name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    env:
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPECTED_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.2.0" >&2
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Resolve signing mode
        id: signing
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          # A locally signed and notarized installer may be prepared as a draft.
          # Only public artifacts are transferred; Apple private keys stay local.
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" == true ]]; then
            test -n "$EXPECTED_APPLE_TEAM_ID"
            echo "mode=prepared" >>"$GITHUB_OUTPUT"
            echo "SIGNING_MODE=developer-id" >>"$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$EXPECTED_APPLE_TEAM_ID" >>"$GITHUB_ENV"
            exit 0
          fi
          required=(
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
            APPLE_TEAM_ID
            APPLE_NOTARY_KEY_BASE64
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
          )
          configured=0
          for name in "${required[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq "${#required[@]}" ]]; then
            echo "mode=developer-id" >>"$GITHUB_OUTPUT"
            echo "SIGNING_MODE=developer-id" >>"$GITHUB_ENV"
            echo "Publishing a Developer ID signed and notarized release."
          else
            echo "Official releases require Developer ID signing and notarization." >&2
            echo "Configure all six Apple secrets, or prepare a locally signed draft installer." >&2
            for name in "${required[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "Missing GitHub Actions secret: $name" >&2
              fi
            done
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/codex-usage-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" \
            | base64 --decode >"$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk '/Developer ID Application/{print $2; exit}'
          )"
          if [[ -z "$IDENTITY" ]]; then
            echo "Developer ID Application identity was not imported" >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >>"$GITHUB_ENV"
          echo "APP_GROUP_IDENTIFIER=$APPLE_TEAM_ID.io.cmmuu.codex-usage-bar" \
            >>"$GITHUB_ENV"

      - name: Build and package DMG
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make release-package

      - name: Load locally signed and notarized draft installer
        if: steps.signing.outputs.mode == 'prepared'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          DMG_NAME="Codex-Usage-Bar-v$VERSION-universal.dmg"
          gh release download "$TAG" --dir dist --pattern "$DMG_NAME" --pattern "$DMG_NAME.sha256"
          (cd dist && shasum -a 256 -c "$DMG_NAME.sha256")
          codesign --verify --verbose=2 "dist/$DMG_NAME"
          xcrun stapler validate "dist/$DMG_NAME"
          MOUNT_DIR="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true; rmdir "$MOUNT_DIR" 2>/dev/null || true' EXIT
          hdiutil attach "dist/$DMG_NAME" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          ditto "$MOUNT_DIR/Codex Usage Bar.app" "dist/Codex Usage Bar.app"
          python3 Scripts/verify_signing.py --app "dist/Codex Usage Bar.app" --team "$APPLE_TEAM_ID" --version "$VERSION" --notarized

      - name: Verify release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          APP="dist/Codex Usage Bar.app"
          WIDGET="$APP/Contents/PlugIns/CodexUsageWidget.appex"
          ICON="$APP/Contents/Resources/AppIcon.icns"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          DMG="dist/Codex-Usage-Bar-v$VERSION-universal.dmg"
          WIDGET_ENTITLEMENTS="$RUNNER_TEMP/widget-entitlements.plist"

          codesign --verify --deep --strict --verbose=2 "$APP"
          (
            cd dist
            shasum -a 256 -c "$(basename "$DMG").sha256"
          )
          test -d "$WIDGET"
          test -f "$ICON"
          test -d "$SPARKLE"
          codesign --verify --deep --strict --verbose=2 "$SPARKLE"
          codesign -d --entitlements :- "$WIDGET" \
            >"$WIDGET_ENTITLEMENTS"
          test "$(
            plutil -extract 'com\.apple\.security\.network\.client' raw \
              "$WIDGET_ENTITLEMENTS"
          )" = "true"
          test "$(
            plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist"
          )" = "AppIcon.icns"
          test "$(
            plutil -extract SUFeedURL raw "$APP/Contents/Info.plist"
          )" = "https://downloads.cmmuu.com/api/releases/codex-usage-bar/appcast.xml"
          test "$(
            plutil -extract SUVerifyUpdateBeforeExtraction raw \
              "$APP/Contents/Info.plist"
          )" = "true"

          python3 Scripts/verify_signing.py --app "$APP" --team "$APPLE_TEAM_ID" --version "$VERSION" --notarized
          codesign --verify --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"

      - name: Generate signed Sparkle appcast
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -n "$SPARKLE_EDDSA_PRIVATE_KEY"
          ./Scripts/generate_appcast.sh

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/Codex-Usage-Bar-v${{ steps.release.outputs.version }}-universal.dmg
            dist/Codex-Usage-Bar-v${{ steps.release.outputs.version }}-universal.dmg.sha256
            dist/appcast.xml
            dist/appcast-center.xml

      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          DMG="dist/Codex-Usage-Bar-v$VERSION-universal.dmg"
          CHECKSUM="$DMG.sha256"
          APPCAST="dist/appcast.xml"
          CENTER_APPCAST="dist/appcast-center.xml"
          NOTES="docs/release-notes/$TAG.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "This version is already published; preserve its signed bytes and use a new version." >&2
              exit 1
            fi
            gh release upload "$TAG" "$APPCAST" "$CENTER_APPCAST"
            gh release edit "$TAG" --draft=false --latest --title "Codex Usage Bar $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$DMG" "$CHECKSUM" "$APPCAST" "$CENTER_APPCAST" \
              --title "Codex Usage Bar $TAG" \
              --notes-file "$NOTES" \
              --latest
          fi

      - name: Verify download center publication
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 Scripts/verify_download_center.py --version "$VERSION" --dist dist --wait-seconds 600
